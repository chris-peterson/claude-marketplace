<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#282a36"/>
  <!-- the helm: one spoke per catalog group, clockwise from the top in route
       order (plan, safe, oriented, waypoints, charts). Mirrors the
       inline #mark in index.html. -->
  <g transform="translate(12,12)">
    <circle cx="20" cy="20" r="10.5" fill="none" stroke="#6272a4" stroke-width="2.2"/>
    <g stroke-width="2.4" stroke-linecap="round">
      <line x1="20" y1="20" x2="20" y2="3" stroke="#ffb86c"/>
      <line x1="20" y1="20" x2="36.17" y2="14.75" stroke="#ff5555"/>
      <line x1="20" y1="20" x2="29.99" y2="33.75" stroke="#bd93f9"/>
      <line x1="20" y1="20" x2="10.01" y2="33.75" stroke="#8be9fd"/>
      <line x1="20" y1="20" x2="3.83" y2="14.75" stroke="#50fa7b"/>
    </g>
    <circle cx="20" cy="3" r="2.6" fill="#ffb86c"/>
    <circle cx="36.17" cy="14.75" r="2.6" fill="#ff5555"/>
    <circle cx="29.99" cy="33.75" r="2.6" fill="#bd93f9"/>
    <circle cx="10.01" cy="33.75" r="2.6" fill="#8be9fd"/>
    <circle cx="3.83" cy="14.75" r="2.6" fill="#50fa7b"/>
    <circle cx="20" cy="20" r="3.6" fill="#f8f8f2"/>
  </g>
</svg>
