<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#282a36"/>
  <!-- the helm: one spoke per catalog group, clockwise from the top in route
       order (plan, safe, oriented, waypoints, charts, orders). Mirrors the
       inline #mark in index.html. -->
  <g transform="translate(12,12)">
    <circle cx="20" cy="20" r="10.5" fill="none" stroke="#6272a4" stroke-width="2.2"/>
    <g stroke-width="2.4" stroke-linecap="round">
      <line x1="20" y1="20" x2="20" y2="3" stroke="#ffb86c"/>
      <line x1="20" y1="20" x2="34.72" y2="11.5" stroke="#ff5555"/>
      <line x1="20" y1="20" x2="34.72" y2="28.5" stroke="#bd93f9"/>
      <line x1="20" y1="20" x2="20" y2="37" stroke="#8be9fd"/>
      <line x1="20" y1="20" x2="5.28" y2="28.5" stroke="#ff79c6"/>
      <line x1="20" y1="20" x2="5.28" y2="11.5" stroke="#50fa7b"/>
    </g>
    <circle cx="20" cy="3" r="2.6" fill="#ffb86c"/>
    <circle cx="34.72" cy="11.5" r="2.6" fill="#ff5555"/>
    <circle cx="34.72" cy="28.5" r="2.6" fill="#bd93f9"/>
    <circle cx="20" cy="37" r="2.6" fill="#8be9fd"/>
    <circle cx="5.28" cy="28.5" r="2.6" fill="#ff79c6"/>
    <circle cx="5.28" cy="11.5" r="2.6" fill="#50fa7b"/>
    <circle cx="20" cy="20" r="3.6" fill="#f8f8f2"/>
  </g>
</svg>
