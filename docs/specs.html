<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bridge.ai — Requirements</title>
<meta name="description" content="Requirements for every bridge.ai plugin, grouped by category.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900&family=JetBrains+Mono:wght@400;500;700&family=Spline+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="/js/docsify-shared.js"></script>
<script>initTheme();</script>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/titlebar.css">
<style>
  :root{
    /* Same ground and same accents as the landing page, which takes them from
       the family's tokens.css. */
    --abyss:light-dark(#f7f7f1,#191a21); --deep:light-dark(#efefe8,#21222c);
    --sea:light-dark(#e8e8e0,#282a36); --hull:light-dark(#dcdcd2,#343746);
    --line-h:light-dark(#c9c9bd,#44475a);
    --fg:var(--color-foreground); --muted:light-dark(#5a6896,#8e99bd);
    --faint:light-dark(#8d94b0,#4b527a);
    --line:light-dark(#deded4,#2a2c38); --line-2:light-dark(#cfcfc4,#33364a);
    --cyan:var(--color-cyan); --green:var(--color-green); --orange:var(--color-orange);
    --pink:var(--color-pink); --purple:var(--color-purple); --red:var(--color-red);
    --yellow:var(--color-yellow);
    --gold:light-dark(#a16207,#e3b341); --claude:light-dark(#c2410c,#d97757);
    /* four functional areas → four colors (same mapping as the catalog) */
    --guard:var(--red); --orient:var(--purple); --ship:var(--cyan); --build:var(--green);
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --disp:'Fraunces',Georgia,'Times New Roman',serif;
    --body:'Spline Sans',ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;padding-top:52px;background:var(--abyss);color:var(--fg);font-family:var(--body);line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:inherit}

  /* --- site nav (mirrors the marketplace) --- */
  .sitenav{position:sticky;top:52px;z-index:20;background:color-mix(in srgb,var(--abyss) 88%,transparent);
    backdrop-filter:blur(9px);border-bottom:1px solid var(--line)}
  .nav-inner{max-width:1040px;margin:0 auto;padding:13px 22px;display:flex;align-items:center;justify-content:space-between}
  .brand{display:inline-flex;align-items:center;gap:11px;font-family:var(--mono);font-size:13px;letter-spacing:.05em;color:var(--fg);text-decoration:none}
  .brand img{width:26px;height:26px}
  .brand b{color:var(--cyan);font-weight:700}
  .brand .back{color:var(--muted);font-size:15px;transition:transform .14s,color .14s}
  .brand:hover .back{transform:translateX(-3px);color:var(--fg)}

  .wrap{max-width:1040px;margin:0 auto;padding:48px 22px 80px}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--cyan);margin:0 0 16px}
  h1{font-family:var(--disp);font-optical-sizing:auto;font-weight:900;font-size:clamp(30px,5vw,50px);
    line-height:1.02;letter-spacing:-.02em;margin:0 0 14px}

  /* --- search rig --- */
  .rig{position:sticky;top:53px;z-index:10;margin:30px 0 0;padding:18px 0 14px;
    background:linear-gradient(var(--abyss) 82%,transparent)}
  .searchbox{display:flex;align-items:center;gap:12px;background:var(--deep);border:1px solid var(--line-2);
    border-radius:13px;padding:0 17px;transition:border-color .15s,box-shadow .15s}
  .searchbox:focus-within{border-color:color-mix(in srgb,var(--gold) 55%,transparent);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 14%,transparent)}
  .searchbox svg{width:18px;height:18px;color:var(--muted);flex:none}
  #q{flex:1;background:none;border:0;outline:none;color:var(--fg);font-family:var(--mono);font-size:15px;padding:15px 0}
  #q::placeholder{color:var(--faint)}
  .clear{background:none;border:0;color:var(--muted);cursor:pointer;font-size:19px;padding:4px 6px;display:none;line-height:1}
  .clear.on{display:block}
  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:center;font-family:var(--mono);font-size:11.5px}
  .scope{color:var(--faint);letter-spacing:.08em;text-transform:uppercase;margin-right:2px}
  .tog{color:var(--muted);background:var(--deep);border:1px solid var(--line-2);padding:6px 12px;border-radius:20px;
    cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:7px;transition:all .12s}
  .tog.on{color:var(--fg);border-color:color-mix(in srgb,var(--gold) 45%,transparent);background:color-mix(in srgb,var(--gold) 10%,transparent)}
  .tog .box{width:12px;height:12px;border-radius:3px;border:1.5px solid var(--faint);display:inline-flex;align-items:center;justify-content:center;font-size:9px}
  .tog.on .box{border-color:var(--gold);background:var(--gold);color:var(--abyss)}
  .spring{flex:1 1 auto}
  .exp{color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:2px;background:none;border:0;font-family:var(--mono);font-size:11.5px}
  .exp:hover{color:var(--fg)}

  .count{font-family:var(--mono);font-size:12px;color:var(--muted);margin:16px 2px 9px}
  .count b{color:var(--gold)}

  /* --- tree --- */
  .tree{border:1px solid var(--line-2);border-radius:13px;overflow:hidden;background:var(--deep)}
  .node.hide,.leaf.hide{display:none}
  .nhead{display:flex;align-items:center;gap:9px;padding:10px 13px;cursor:pointer;user-select:none}
  .plugin>.nhead{border-top:1px solid var(--line-2)}
  .plugin:first-child>.nhead{border-top:0}
  .plugin>.nhead:hover{background:var(--sea)}
  .chev{color:var(--faint);font-size:10px;width:12px;transition:transform .14s;flex:none}
  .node.open>.nhead .chev{transform:rotate(90deg)}
  .plugin>.nhead .dot{width:9px;height:9px;border-radius:50%;background:var(--ac);flex:none;box-shadow:0 0 10px color-mix(in srgb,var(--ac) 60%,transparent)}
  .plugin>.nhead .name{font-family:var(--mono);font-size:14.5px;font-weight:600;color:var(--fg)}
  .plugin>.nhead .gloss{color:var(--faint);font-size:12px;font-family:var(--body);font-style:italic;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nhead .count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);
    font-variant-numeric:tabular-nums;background:var(--sea);border:1px solid var(--line-2);border-radius:20px;padding:2px 9px;flex:none}
  .children{display:none}
  .node.open>.children{display:block}

  .cat{margin-left:21px;border-left:1px solid var(--line-2)}
  .cat>.nhead{padding:8px 13px}
  .cat>.nhead:hover{background:var(--sea)}
  .cat>.nhead .cname{font-family:var(--mono);font-size:12.5px;color:var(--ac);font-weight:600}
  .cat>.nhead .clabel{color:var(--fg);font-size:13px;font-family:var(--body)}
  .cdesc{margin-left:41px;border-left:1px solid var(--line-2);padding:6px 14px 10px;color:var(--muted);
    font-size:13px;max-width:70ch}
  .cdesc.hide{display:none}

  .req{margin-left:41px;border-left:1px solid var(--line-2);display:grid;grid-template-columns:104px 1fr;gap:13px;
    align-items:baseline;padding:8px 13px 8px 15px}
  .req:hover{background:var(--sea)}
  .req .rid{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--gold);white-space:nowrap}
  .req .rtext{font-size:13.5px;color:#c4c8dc}
  /* inline markdown inside requirement / description / category-label prose */
  .cdesc code,.req .rtext code,.clabel code{font-family:var(--mono);font-size:.86em;color:var(--fg);
    background:var(--sea);border:1px solid var(--line-2);border-radius:4px;padding:.5px 4px}
  .cdesc strong,.req .rtext strong,.clabel strong{color:var(--fg);font-weight:600}
  .cdesc em,.req .rtext em,.clabel em{font-style:italic}
  mark{background:color-mix(in srgb,var(--gold) 28%,transparent);color:var(--fg);border-radius:3px;padding:0 1px}
  .empty{padding:38px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:13px;
    border:1px solid var(--line-2);border-radius:13px;margin-top:10px}

  .footnote{margin-top:34px;font-family:var(--mono);font-size:11.5px;color:var(--faint);text-align:center;letter-spacing:.02em}
  .footnote a{color:var(--muted);text-decoration:underline;text-underline-offset:2px}
  .footnote a:hover{color:var(--fg)}

  @media(max-width:600px){
    .req{grid-template-columns:84px 1fr;margin-left:26px}
    .cat{margin-left:12px}.cdesc{margin-left:26px}
    .plugin>.nhead .gloss{display:none}
  }
  @media(prefers-reduced-motion:reduce){.chev{transition:none}}
</style>
</head>
<body class="sidebar-hidden">

<nav class="sitenav">
  <div class="nav-inner">
    <a class="brand" href="index.html"><span class="back">&larr;</span><img src="favicon.svg" alt=""><span>bridge<b>.ai</b></span></a>
  </div>
</nav>

<div class="wrap">
  <p class="eyebrow">bridge.ai &middot; specifications</p>
  <h1>Requirements</h1>

  <div class="rig">
    <label class="searchbox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Search the tree&hellip;">
      <button class="clear" id="clear" aria-label="Clear search">&times;</button>
    </label>
    <div class="controls">
      <span class="scope">search</span>
      <button class="tog on" id="tCat" type="button"><span class="box">&check;</span>categories</button>
      <button class="tog on" id="tReq" type="button"><span class="box">&check;</span>requirements</button>
      <span class="spring"></span>
      <button class="exp" id="expand" type="button">expand all</button>
    </div>
  </div>

  <div class="count" id="count"></div>
  <div class="tree" id="tree"></div>
  <div class="empty" id="empty" style="display:none">nothing matches &mdash; try a shorter term or toggle a filter back on</div>

  <p class="footnote"><a href="index.html">&larr; back to bridge.ai</a></p>
</div>

<script>
(function(){
  // plugin → accent, ordered by the catalog's four functional groups so colors
  // cluster the way they do on the home page.
  const GROUPS=[
    {ac:"--guard",  slugs:["ClaudeWatch","shipshape"]},
    {ac:"--orient", slugs:["tack","beacon"]},
    {ac:"--ship",   slugs:["anchor"]},
    {ac:"--build",  slugs:["sextant","cleat"]}
  ];
  const accentVar=(token,shade)=> shade
    ? `color-mix(in srgb, var(${token}) ${Math.round((1-(.26+.2*shade))*100)}%, var(--fg))`
    : `var(${token})`;
  const AC={}, ORDER=[];
  GROUPS.forEach(g=> g.slugs.forEach((slug,idx)=>{ AC[slug]=accentVar(g.ac,idx); ORDER.push(slug); }));

  const el=(t,c)=>{const e=document.createElement(t); if(c)e.className=c; return e;};
  const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const escRe=t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const hl=(s,term)=>{ s=esc(s); if(!term) return s;
    return s.replace(new RegExp("("+escRe(term)+")","ig"),"<mark>$1</mark>"); };
  // inline markdown for requirement/description prose: `code`, **bold**, *italic*.
  // Code spans are pulled out first (via NUL placeholders) so their contents
  // aren't re-parsed for emphasis.
  const md=s=>{ const codes=[];
    s=s.replace(/`([^`]+)`/g,(_,c)=>{ codes.push(c); return "\u0000"+(codes.length-1)+"\u0000"; });
    s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\*([^*]+)\*/g,"<em>$1</em>");
    return s.replace(/\u0000(\d+)\u0000/g,(_,i)=>"<code>"+codes[+i]+"</code>"); };
  // render markdown, then highlight the search term across text nodes only (never
  // inside the generated tags, so <code>/<strong>/<em> aren't corrupted).
  const fmt=(s,term)=>{ let html=md(esc(s)); if(!term) return html;
    const re=new RegExp("("+escRe(term)+")","ig");
    return html.split(/(<[^>]+>)/).map(seg=> seg.charAt(0)==="<" ? seg : seg.replace(re,"<mark>$1</mark>")).join(""); };

  const treeEl=document.getElementById("tree"), countEl=document.getElementById("count");
  const q=document.getElementById("q"), clearBtn=document.getElementById("clear"), expandBtn=document.getElementById("expand");
  let scopeCat=true, scopeReq=true, allOpen=false;
  const model=[];
  let totalReqs=0, totalCats=0;

  function build(plugins){
    const bySlug={}; plugins.forEach(p=> bySlug[p.name]=p);
    const ordered=ORDER.filter(s=>bySlug[s]).concat(plugins.map(p=>p.name).filter(s=>!ORDER.includes(s)));

    ordered.forEach(slug=>{
      const p=bySlug[slug];
      totalReqs+=p.reqCount; totalCats+=p.catCount;
      const pnode=el("div","node plugin"); pnode.style.setProperty("--ac",AC[slug]||"var(--cyan)");
      const phead=el("div","nhead");
      phead.innerHTML='<span class="chev">&#9656;</span><span class="dot"></span><span class="name">'+esc(slug)+'</span>'
        +(p.gloss?'<span class="gloss">'+esc(p.gloss)+'</span>':'')
        +'<span class="count">'+p.reqCount+'</span>';
      phead.onclick=()=>pnode.classList.toggle("open");
      const pchildren=el("div","children");
      pnode.appendChild(phead); pnode.appendChild(pchildren);

      const catModel=(p.categories||[]).map(c=>{
        const cnode=el("div","node cat");
        const chead=el("div","nhead");
        chead.innerHTML='<span class="chev">&#9656;</span><span class="cname">'+esc(c.prefix)+'</span>'
          +(c.label&&c.label!==c.prefix?'<span class="clabel">'+fmt(c.label,"")+'</span>':'')
          +'<span class="count">'+c.reqs.length+'</span>';
        chead.onclick=(e)=>{ e.stopPropagation(); cnode.classList.toggle("open"); };
        const cchildren=el("div","children");
        cnode.appendChild(chead); cnode.appendChild(cchildren);
        let descEl=null;
        if(c.desc){ descEl=el("div","cdesc"); descEl.innerHTML=fmt(c.desc,""); cchildren.appendChild(descEl); }
        const reqModel=c.reqs.map(r=>{
          const rn=el("div","leaf req");
          rn.innerHTML='<span class="rid">'+esc(r.id)+'</span><span class="rtext">'+fmt(r.text,"")+'</span>';
          cchildren.appendChild(rn);
          return {el:rn, id:r.id, text:r.text, rid:rn.querySelector(".rid"), rtx:rn.querySelector(".rtext")};
        });
        pchildren.appendChild(cnode);
        return {el:cnode, prefix:c.prefix, label:c.label||"", desc:c.desc||"", descEl,
                cname:chead.querySelector(".cname"), clabel:chead.querySelector(".clabel"), reqs:reqModel};
      });
      treeEl.appendChild(pnode);
      model.push({el:pnode, plugin:slug, name:phead.querySelector(".name"), cats:catModel});
    });
  }

  function updateCount(term, reqN, catN, plugN){
    if(!term){ countEl.innerHTML='<b>'+totalReqs+'</b> requirements &middot; <b>'+totalCats+'</b> categories &middot; <b>'+model.length+'</b> specs'; return; }
    countEl.innerHTML='<b>'+reqN+'</b> requirement'+(reqN===1?'':'s')
      +' &nbsp;&middot;&nbsp; <b>'+catN+'</b> categor'+(catN===1?'y':'ies')
      +' &nbsp;&middot;&nbsp; in <b>'+plugN+'</b> spec'+(plugN===1?'':'s');
  }

  function reset(){
    treeEl.style.display="block"; document.getElementById("empty").style.display="none";
    model.forEach(p=>{ p.el.classList.remove("hide"); p.el.classList.toggle("open",allOpen); p.name.innerHTML=esc(p.plugin);
      p.cats.forEach(c=>{ c.el.classList.remove("hide"); c.el.classList.toggle("open",allOpen);
        c.cname.innerHTML=esc(c.prefix); if(c.clabel) c.clabel.innerHTML=fmt(c.label,"");
        if(c.descEl){ c.descEl.classList.remove("hide"); c.descEl.innerHTML=fmt(c.desc,""); }
        c.reqs.forEach(r=>{ r.el.classList.remove("hide"); r.rid.innerHTML=esc(r.id); r.rtx.innerHTML=fmt(r.text,""); }); }); });
    updateCount("");
  }

  function filter(){
    const term=q.value.trim().toLowerCase();
    if(!term){ reset(); return; }
    let reqN=0,catN=0,plugN=0;
    model.forEach(p=>{
      const plugMatch=p.plugin.toLowerCase().includes(term);
      p.name.innerHTML=hl(p.plugin,plugMatch?term:"");
      let pShown=false;
      p.cats.forEach(c=>{
        const pxHit=scopeCat && c.prefix.toLowerCase().includes(term);
        const lblHit=scopeCat && c.label && c.label.toLowerCase().includes(term);
        const dscHit=scopeCat && c.desc && c.desc.toLowerCase().includes(term);
        const catMatch=pxHit||lblHit||dscHit;
        c.cname.innerHTML=hl(c.prefix,pxHit?term:"");
        if(c.clabel) c.clabel.innerHTML=fmt(c.label,lblHit?term:"");
        if(c.descEl){ c.descEl.innerHTML=fmt(c.desc,dscHit?term:""); c.descEl.classList.toggle("hide",!(catMatch||plugMatch)); }
        let cHasReq=false;
        c.reqs.forEach(r=>{
          const rm=scopeReq && (r.id.toLowerCase().includes(term)||r.text.toLowerCase().includes(term));
          const show=rm||catMatch||plugMatch;
          r.el.classList.toggle("hide",!show);
          if(show){ r.rid.innerHTML=hl(r.id,rm?term:""); r.rtx.innerHTML=fmt(r.text,rm?term:""); }
          if(rm){ cHasReq=true; reqN++; }
        });
        const cShow=catMatch||cHasReq||plugMatch;
        c.el.classList.toggle("hide",!cShow);
        c.el.classList.toggle("open",cShow);
        if(cShow){ pShown=true; if(catMatch) catN++; }
      });
      const pShow=pShown||plugMatch;
      p.el.classList.toggle("hide",!pShow);
      p.el.classList.toggle("open",pShow);
      if(pShow) plugN++;
    });
    const any=reqN||catN||plugN;
    document.getElementById("empty").style.display=any?"none":"block";
    treeEl.style.display=any?"block":"none";
    updateCount(term,reqN,catN,plugN);
  }

  let timer=null;
  q.addEventListener("input",()=>{ clearBtn.classList.toggle("on",q.value.length>0); clearTimeout(timer); timer=setTimeout(filter,110); });
  clearBtn.onclick=()=>{ q.value=""; clearBtn.classList.remove("on"); filter(); q.focus(); };
  document.getElementById("tCat").onclick=function(){ scopeCat=!scopeCat; this.classList.toggle("on",scopeCat); filter(); };
  document.getElementById("tReq").onclick=function(){ scopeReq=!scopeReq; this.classList.toggle("on",scopeReq); filter(); };
  expandBtn.onclick=()=>{ allOpen=!allOpen; expandBtn.textContent=allOpen?"collapse all":"expand all"; if(!q.value.trim()) reset(); };

  fetch("specs.json").then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(data=>{ build(data.plugins||[]); updateCount(""); })
    .catch(err=>{ treeEl.style.display="none";
      document.getElementById("empty").style.display="block";
      document.getElementById("empty").textContent="couldn't load specs.json — run `just build` (or `just specs-data`) to generate it";
      console.error("specs.json load failed:",err); });
})();
</script>
<script>initTitlebar({ name: 'claude-marketplace' });</script>
</body>
</html>
