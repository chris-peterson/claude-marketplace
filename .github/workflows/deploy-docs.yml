name: Deploy docs

on:
  push:
    branches: [main]
    # ignore the build's own commits, else they would retrigger it
    paths-ignore: ['suite/artifacts.csv', '.claude-plugin/marketplace.json']
  repository_dispatch:
    types: [plugin-released]
  workflow_dispatch:

permissions:
  contents: write   # to commit the generated manifest and the artifact log
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - run: pip install pyyaml "shipyard @ git+https://github.com/chris-peterson/shipyard@v2"

      - name: Sync sibling plugin repos
        run: bash suite/sync.sh

      # marketplace.json is a projection of plugins.yml and the synced plugins'
      # own plugin.yml, so it regenerates here rather than being hand-edited: a
      # description reworded in a plugin's repo reaches the catalog by this step
      # running, not by a second edit landing in this one.
      - name: Generate the marketplace manifest
        run: shipyard gen-marketplace-json

      - name: Generate doc site data (ephemeral)
        run: |
          shipyard gen-plugins-js
          shipyard gen-events-json
          python3 suite/build-specs-data.py

      - name: Record artifact changes into the rolling log
        run: python3 suite/record-artifacts.py

      # Runs after the recorder, so the growth view plots the change point this
      # run just logged rather than the one before it. Reads the spokes' tags and
      # changelogs off disk, which is why the sync step above is its only input.
      - name: Project the growth-view data (ephemeral)
        run: shipyard gen-artifacts-json

      # Reads the artifacts.json the step above wrote, so a release that
      # dispatched this run is in the changelog and the feed.
      - name: Generate the What's new page and its feed (ephemeral)
        run: |
          python3 -I suite/build-whats-new.py
          python3 -I suite/changelog_feed.py docs/whats-new.md \
            --site-url https://chris-peterson.github.io/claude-marketplace/ \
            --title "bridge.ai: What's new" \
            --description "Changes across the bridge.ai Claude Code plugins." \
            --home whats-new --router path --out docs/feed.xml

      - name: Commit the generated manifest and artifact log if they changed
        run: |
          tracked='suite/artifacts.csv .claude-plugin/marketplace.json'
          if ! git diff --quiet -- $tracked; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $tracked
            git commit -m "chore: regenerate the catalog ($(date -u +%F))"
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
